<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Waleed Elhadi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0b;--bg2:#141410;--bg3:#1c1c17;--bg4:#232318;
  --copper:#c8843a;--copper2:#e8a456;--copper-dim:#6b4420;
  --teal:#3aac8c;--teal2:#52c8a4;--teal-dim:#1a5c48;
  --ink:#f0ece4;--ink2:#a09880;--ink3:#5a5648;
  --line:#2a2820;--line2:#3a3828;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Outfit',system-ui,sans-serif;
  --max:900px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;font-weight:300;overflow-x:hidden}

/* Reveal */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
.reveal.visible{opacity:1;transform:none}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.25s}

/* Nav */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1.5rem,5vw,4rem);height:60px;background:rgba(13,13,11,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.nav-logo{font-family:var(--serif);font-size:1.3rem;font-weight:500;color:var(--copper2);text-decoration:none;letter-spacing:.03em}
.nav-links{display:flex;gap:2.5rem;list-style:none}
.nav-links a{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);text-decoration:none;transition:color .2s}
.nav-links a:hover{color:var(--copper2)}
.nav-links a.active{color:var(--copper2)}

/* Page hero */
.page-hero{padding:clamp(6rem,12vw,9rem) clamp(1.5rem,5vw,4rem) clamp(2rem,5vw,3rem);max-width:var(--max);margin:0 auto}
.page-eyebrow{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);margin-bottom:1rem;display:flex;align-items:center;gap:.75rem}
.page-eyebrow::before{content:'';display:block;width:28px;height:1px;background:var(--copper)}
h1.page-title{font-family:var(--serif);font-size:clamp(3rem,8vw,5.5rem);font-weight:500;line-height:1;letter-spacing:-.02em;color:var(--ink);margin-bottom:1rem}
h1.page-title em{font-style:italic;color:var(--copper2)}
.page-sub{font-size:.95rem;color:var(--ink2);max-width:480px;line-height:1.8}

.hairline{width:100%;height:1px;background:linear-gradient(to right,transparent,var(--line2) 20%,var(--line2) 80%,transparent)}

/* ── Single timeline ─────────────────────────────────── */
.tl-wrap{max-width:var(--max);margin:0 auto;padding:clamp(3rem,8vw,5rem) clamp(1.5rem,5vw,4rem)}

.timeline{position:relative;padding-left:3rem}

/* Spine on the left */
.timeline::before{
  content:'';position:absolute;
  left:7px;top:0;bottom:0;
  width:1px;
  background:linear-gradient(to bottom,var(--copper-dim),var(--line2) 85%,transparent);
}

/* Each item */
.tl-item{position:relative;margin-bottom:3rem}
.tl-item:last-child{margin-bottom:0}

/* Dot */
.tl-item::before{
  content:'';
  position:absolute;
  left:-2.65rem;
  top:1.5rem;
  width:13px;height:13px;
  border-radius:50%;
  background:var(--bg);
  border:2px solid var(--teal);
  box-shadow:0 0 0 4px rgba(58,172,140,.1),0 0 10px rgba(58,172,140,.2);
  transition:box-shadow .3s;
  z-index:2;
}
.tl-item:hover::before{
  box-shadow:0 0 0 7px rgba(58,172,140,.15),0 0 20px rgba(58,172,140,.35);
}

/* Card */
.proj-card{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  transition:border-color .3s,background .3s;
}
.proj-card:hover{border-color:var(--teal-dim);background:var(--bg3)}

/* ── Slideshow ───────────────────────────────────────── */
.slideshow{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--bg4)}
.slides-track{display:flex;height:100%;transition:transform .55s cubic-bezier(.77,0,.18,1);will-change:transform}
.slide{flex:0 0 100%;height:100%;overflow:hidden}
.slide img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s cubic-bezier(.16,1,.3,1)}
.proj-card:hover .slide img{transform:scale(1.04)}

.proj-img-placeholder{width:100%;aspect-ratio:16/9;background:var(--bg4);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.proj-img-placeholder::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(58,172,140,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(58,172,140,.04) 1px,transparent 1px);background-size:24px 24px}
.ph-icon{width:36px;height:36px;opacity:.2;position:relative;z-index:1;fill:none;stroke:var(--ink3);stroke-width:1}

.slide-dots{position:absolute;bottom:.6rem;left:50%;transform:translateX(-50%);display:flex;gap:.4rem;z-index:10;background:rgba(0,0,0,.35);border-radius:100px;padding:.3rem .5rem}
.slide-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .3s,transform .3s;cursor:pointer;border:none;padding:0}
.slide-dot.active{background:#fff;transform:scale(1.3)}
.slide-count{position:absolute;top:.65rem;right:.7rem;z-index:10;font-size:.65rem;background:rgba(0,0,0,.5);color:rgba(255,255,255,.75);border-radius:100px;padding:.2rem .55rem;backdrop-filter:blur(4px);pointer-events:none;letter-spacing:.04em}

/* Card body */
.proj-body{padding:1.5rem 1.8rem 1.8rem}
.proj-year{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:.4rem}
.proj-title{font-family:var(--serif);font-size:1.3rem;font-weight:500;color:var(--ink);line-height:1.2;margin-bottom:.75rem}
.proj-desc{font-size:.88rem;color:var(--ink2);line-height:1.8}
.proj-tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.1rem}
.proj-tag{font-size:.75rem;color:var(--ink3);background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:3px;padding:.2rem .6rem;transition:border-color .2s,color .2s}
.proj-card:hover .proj-tag{border-color:var(--teal-dim);color:var(--ink2)}

/* Floating back button */
.fab{position:fixed;bottom:2rem;right:2rem;z-index:100;display:flex;align-items:center;gap:.6rem;padding:.75rem 1.3rem;border-radius:100px;background:var(--bg2);border:1px solid var(--line2);color:var(--ink2);font-family:var(--sans);font-size:.75rem;letter-spacing:.06em;text-decoration:none;font-weight:500;transition:all .25s;backdrop-filter:blur(8px)}
.fab:hover{border-color:var(--copper);color:var(--copper2);background:var(--bg3)}
.fab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;flex-shrink:0}

/* Mobile */
@media(max-width:600px){
  .nav-links{display:none}
  .timeline{padding-left:2.5rem}
  .timeline::before{left:6px}
  .tl-item::before{left:-2.15rem}
  .proj-body{padding:1.2rem 1.3rem 1.5rem}
  .fab{bottom:1.2rem;right:1.2rem;padding:.65rem 1rem}
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">W.E.</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#experience">Experience</a></li>
    <li><a href="index.html#skills">Skills</a></li>
    <li><a href="projects.html" class="active">Projects</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</nav>

<div class="page-hero">
  <p class="page-eyebrow reveal">Personal builds</p>
  <h1 class="page-title reveal d1">Things I built<br><em>on my own terms</em></h1>
  <p class="page-sub reveal d2">Side projects built out of curiosity, not requirement. No procurement process, no budget committee — just the right way to do it.</p>
</div>

<div class="hairline"></div>

<div class="tl-wrap">
  <div class="timeline" id="timeline"></div>
</div>

<a class="fab" href="index.html">
  <svg viewBox="0 0 24 24"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
  Back to portfolio
</a>

<script src="projects_data.js"></script>
<script>
// ── Slideshow engine ──────────────────────────────────────
const slideshows=[];

function buildSlideshow(imgs,title){
  const id='ss_'+Math.random().toString(36).slice(2,7);
  const slides=imgs.map(src=>`<div class="slide"><img src="${src}" alt="${title}" loading="lazy"></div>`).join('');
  const dots=imgs.length>1
    ?`<div class="slide-dots" id="dots_${id}">${imgs.map((_,i)=>`<button class="slide-dot${i===0?' active':''}" data-ss="${id}" data-idx="${i}"></button>`).join('')}</div>`:'';
  const count=imgs.length>1?`<div class="slide-count" id="count_${id}">1 / ${imgs.length}</div>`:'';
  slideshows.push({id,total:imgs.length,current:0,interval:null});
  return `<div class="slideshow" id="${id}"><div class="slides-track" id="track_${id}">${slides}</div>${dots}${count}</div>`;
}

function goToSlide(id,idx){
  const ss=slideshows.find(s=>s.id===id);if(!ss)return;
  ss.current=(idx+ss.total)%ss.total;
  const t=document.getElementById('track_'+id);
  if(t) t.style.transform=`translateX(-${ss.current*100}%)`;
  const d=document.getElementById('dots_'+id);
  if(d) d.querySelectorAll('.slide-dot').forEach((dot,i)=>dot.classList.toggle('active',i===ss.current));
  const c=document.getElementById('count_'+id);
  if(c) c.textContent=`${ss.current+1} / ${ss.total}`;
}

function startAuto(id){
  const ss=slideshows.find(s=>s.id===id);
  if(!ss||ss.total<=1||ss.interval)return;
  ss.interval=setInterval(()=>goToSlide(id,ss.current+1),1500);
}
function stopAuto(id){
  const ss=slideshows.find(s=>s.id===id);
  if(!ss)return;
  clearInterval(ss.interval);ss.interval=null;
}

document.addEventListener('click',e=>{
  const dot=e.target.closest('.slide-dot');
  if(!dot)return;
  stopAuto(dot.dataset.ss);
  goToSlide(dot.dataset.ss,parseInt(dot.dataset.idx,10));
});

// ── Render projects ───────────────────────────────────────
const HOBBY = (typeof PROJECTS!=='undefined'&&PROJECTS.hobby)?PROJECTS.hobby:[];

const tl=document.getElementById('timeline');

HOBBY.forEach(p=>{
  const imgs=Array.isArray(p.imgs)&&p.imgs.length?p.imgs:(p.img?[p.img]:[]);
  const titleSize=p.titleSize||'1.3rem';
  const bodySize=p.bodySize||'0.88rem';

  const mediaHTML=imgs.length
    ?buildSlideshow(imgs,p.title)
    :`<div class="proj-img-placeholder"><svg class="ph-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>`;

  const item=document.createElement('div');
  item.className='tl-item reveal';
  item.innerHTML=`<div class="proj-card">
    ${mediaHTML}
    <div class="proj-body">
      <div class="proj-year">${p.year}</div>
      <div class="proj-title" style="font-size:${titleSize}">${p.title}</div>
      <p class="proj-desc" style="font-size:${bodySize}">${p.desc}</p>
      <div class="proj-tags">${(p.tags||[]).map(t=>`<span class="proj-tag">${t}</span>`).join('')}</div>
    </div>
  </div>`;
  tl.appendChild(item);
});

// ── Intersection observers ────────────────────────────────
const ssObs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    e.target.querySelectorAll('.slideshow').forEach(el=>{
      e.isIntersecting?startAuto(el.id):stopAuto(el.id);
    });
  });
},{threshold:0.3});

const revObs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')});
},{threshold:0.1});

document.querySelectorAll('.tl-item').forEach(el=>{
  ssObs.observe(el);
  revObs.observe(el);
});
document.querySelectorAll('.reveal:not(.tl-item)').forEach(el=>revObs.observe(el));
</script>
</body>
